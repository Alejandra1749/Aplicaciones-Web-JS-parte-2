<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contar números pares e impares</title>
</head>
<body>
<h2>Contador de números pares e impares</h2>
<button onclick="contarNumeros()">Ingresar números</button>
<p id="resultado"></p>
<script>
function contarNumeros() {
  let pares = 0;
  let impares = 0;
  for (let i = 1; i <= 5; i++) {
    let valor = parseInt(prompt("Ingrese el número entero " + i + ":"));

    if (valor % 2 == 0) {
      pares++;
    } else {
      impares++;
    }
  }
  document.getElementById("resultado").innerHTML =
    "Cantidad de números pares: " + pares + "<br>" +
    "Cantidad de números impares: " + impares;
}
</script>
</body>
</html>
