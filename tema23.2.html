<!DOCTYPE html>
<html>
<head>
  <title>Contar Nombres (insensible)</title>
</head>
<body>
  <script>
    let contador = 0;
    let nombre;
    do {
      nombre = prompt("Nombre (fin/Fin/FIN para terminar):");
      if (nombre.toLowerCase() !== "fin") contador++;
    } while (nombre.toLowerCase() !== "fin");
    alert("Nombres ingresados: " + contador);
  </script>
