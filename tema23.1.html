<!DOCTYPE html>
<html>
<head>
  <title>Contar Nombres</title>
</head>
<body>
  <script>
    let contador = 0;
    let nombre;
    do {
      nombre = prompt("Nombre (Fin para terminar):");
      if (nombre !== "Fin") contador++;
    } while (nombre !== "Fin");
    alert("Nombres ingresados: " + contador);
  </script>
