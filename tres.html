<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sueldos de Empleados</title>
</head>
<body>
<h2>Control de sueldos de empleados</h2>
<button onclick="calcularSueldos()">Ingresar sueldos</button>
<p id="resultado"></p>
<script>
function calcularSueldos() {
  let entre100y300 = 0;
  let masDe300 = 0;
  let total = 0;
  let empleados = 5;
  for (let i = 1; i <= empleados; i++) {
    let sueldo = parseFloat(prompt("Ingrese el sueldo del empleado " + i + " (entre 100 y 500):"));
    total += sueldo;
    if (sueldo >= 100 && sueldo <= 300) {
      entre100y300++;
    } else if (sueldo > 300) {
      masDe300++;
    }
  }
  document.getElementById("resultado").innerHTML =
    "Empleados que cobran entre $100 y $300: " + entre100y300 + "<br>" +
    "Empleados que cobran más de $300: " + masDe300 + "<br>" +
    "Gasto total en sueldos: $" + total.toFixed(2);
}
</script>
</body>
</html>
