<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejemplo de JavaScript</title>
  <meta charset="UTF-8">
</head>
<body>
  <form>
    <input type="button" onclick="mostrarMensaje(1)" value="1">
    <input type="button" onclick="mostrarMensaje(2)" value="2">
    <input type="button" onclick="mostrarMensaje(3)" value="3">
  </form>
  <script>
    function mostrarMensaje(numero) {
      alert("Se presionó el botón: " + numero);
    }
  </script>
</body>
</html>
