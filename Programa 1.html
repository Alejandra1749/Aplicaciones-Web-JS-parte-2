<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Problema 1 - Suma hasta 0</title>
</head>
<body>
  <h2>Acumular valores</h2>
  <p>Resultado: <span id="resultado"></span></p>

  <script>
    let numero, suma = 0;
    do {
      numero = parseInt(prompt("Ingrese un número :"));
      if (numero != 0) {
        suma += numero;
      }
    } while (numero != 0);

    document.getElementById("resultado").innerText = suma;
  </script>
</body>
</html>
