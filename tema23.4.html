<head>
  <title>Palíndromo</title>
</head>
<body>
  <script>
    let palabra = prompt("Ingrese palabra:");
    let limpia = palabra.toLowerCase().replace(/[^a-z]/g, '');
    let invertida = limpia.split('').reverse().join('');
    alert(limpia === invertida ? "ES palíndromo" : "NO es palíndromo");
  </script>
